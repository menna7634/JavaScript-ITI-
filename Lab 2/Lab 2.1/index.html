<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Day 2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

    <form name="userForm" onsubmit="return validateForm(this)">
        
        <label for="userName">Name</label>
        <input type="text" name="userName" id="userName" placeholder="Enter your name" required>

        <label for="phone">Phone Number</label>
        <input type="text" name="phone" id="phone" placeholder="8 digits" required>

        <label for="mobile">Mobile Number</label>
        <input type="text" name="mobile" id="mobile" placeholder="11 digits (010, 011, 012)" required>

        <label for="email">Email</label>
        <input type="text" name="email" id="email" placeholder="abc@123.com" required>

        <input type="submit" value="Submit Info">
    </form>

    <script src="script.js"></script>
</body>
</html>
