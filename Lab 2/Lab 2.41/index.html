<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Functions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>JS Functions</h1>

        <div class="grid">
            <button class="card" onclick="ExactlyTwo()">
                <span>1</span>
                <h3>Exactly Two Numbers</h3>
            </button>

            <button class="card" onclick="Reverse()">
                <span>2</span>
                <h3>Reverse Numbers</h3>
            </button>

            <button class="card" onclick="Add()">
                <span>3</span>
                <h3>Sum Numbers</h3>
            </button>

            <button class="card" onclick="Day()">
                <span>4</span>
                <h3>Get Day Name</h3>
            </button>
        </div>
    </div>

   <script src="script.js"></script>  
</body>
</html>
