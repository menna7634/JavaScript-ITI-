<!DOCTYPE html>
<html lang="en">
<head>
    <title>Array Sorting</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Enter 5 Numbers</h2>

    <div class="inputs">
        <input type="text" id="n1" placeholder="1">
        <input type="text" id="n2" placeholder="2">
        <input type="text" id="n3" placeholder="3">
        <input type="text" id="n4" placeholder="4">
        <input type="text" id="n5" placeholder="5">
        <!-- pattern attribute (only in form)-->
    </div>

    <button onclick="sortNumbers()">Sort</button>

    <div class="result" id="original"></div>
    <div class="result" id="asc"></div>
    <div class="result" id="desc"></div>
</div>

<script src="script.js"></script>
</body>
</html>
