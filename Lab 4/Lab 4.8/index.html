<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>User Form</h2>
        <div class="form-group">
            <label for="uName">Name:</label>
            <input type="text" id="uName" placeholder="Enter Your Name"
                       pattern="^[A-Za-z]+(?: [A-Za-z]+)*$" required
                       title="Name must contain letters and spaces only">

            <p class="error" id="nameError"></p>
        </div>

        <div class="form-group">
            <label for="uAge">Age:</label>
            <input type="text" id="uAge" placeholder="Enter Your Age">
            <p class="error" id="ageError"></p>
        </div>

        <div class="form-group">
            <label for="uEmail">Email:</label>
            <input type="text" id="uEmail" placeholder="Enter Your Email">
            <p class="error" id="emailError"></p>
        </div>

        <div class="buttons">
            <button id="addBtn">Add</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>

    <table id="dataTable">
        <tr><th>Name</th><th>Age</th><th>Email</th></tr>
    </table>

    <script src="script.js"></script>
</body>
</html>
